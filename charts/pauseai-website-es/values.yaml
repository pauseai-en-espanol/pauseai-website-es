replicaCount: 1
image:
  repository: harbor.danilupion.com/pauseai-es/pauseai-website-es
  tag: 1.1.7.e98082d
  pullPolicy: IfNotPresent
imagePullSecrets: []
nameOverride: ''
fullnameOverride: ''
podAnnotations: {}
podLabels: {}
podSecurityContext: {}
securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
service:
  type: ClusterIP
  port: 80
  targetPort: 3000
ingress:
  enabled: false
  className: ''
  annotations: {}
  hosts:
    - host: pauseai-es.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
env:
  - name: PARAGLIDE_LOCALES
    value: 'es'
  - name: L10N_OFFLINE
    value: '1'
